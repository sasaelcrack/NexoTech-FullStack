databases:
  - name: nexotech-db
    databaseName: bd_nexotech
    user: nexotech

services:
  - type: web
    name: nexotech-api
    runtime: docker
    rootDir: backend-fastapi
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DB_HOST
        fromDatabase:
          name: nexotech-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nexotech-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: nexotech-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: nexotech-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nexotech-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: CHATBOT_IA_LIMITE_DIARIO
        value: "150"
      - key: CHATBOT_IA_MAX_TOKENS
        value: "200"

  - type: web
    name: nexotech-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
